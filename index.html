<!DOCTYPE html>
<html>
<head>
    <title>Password Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Brute-Force Password Analyzer</h1>
    <p>Input your password to see how it holds up.</p>

    <div class="card">
        <label>Password</label>

        <div class="password-container">
            <input type="password" id="password">
            <button type="button" onclick="togglePassword(this)">Show</button>
        </div>

        <label>Minimum Length</label>
        <input type="number" id="minLength" value="8">

        <label><input type="checkbox" id="upper" checked> Required Uppercase?</label>
        <label><input type="checkbox" id="digit" checked> Required Number?</label>
        <label><input type="checkbox" id="symbol"> Required Special Character?</label>

        <label>Crack Test Time Limit (seconds)</label>
        <input type="number" id="timeLimit" value="2">

        <button onclick="runAnalysis()">Run Analysis</button>

        <div id="errorBox" class="error-box" style="display:none;"></div>
    </div>

    <div class="card results" id="results" style="display:none;">
        <h2>Results</h2>

            <div class="result-grid">

        <div class="result-box">
            <span class="result-label">Score</span>
            <span class="result-value">
                <span id="score"></span>/100
            </span>
        </div>

        <div class="result-box">
            <span class="result-label">Strength</span>
            <span class="result-value" id="strength"></span>
        </div>

        <div class="result-box">
            <span class="result-label">Cracked</span>
            <span class="result-value" id="cracked"></span>
        </div>

        <div class="result-box">
            <span class="result-label">Time</span>
            <span class="result-value">
                <span id="time"></span>s
            </span>
        </div>

    </div>

    <div class="section-box">
        <h3>Weaknesses Found</h3>
        <ul id="feedback"></ul>
    </div>

    <div class="section-box">
        <h3>Suggestions</h3>
        <ul id="suggestions"></ul>
    </div>

    <div class="section-box">
        <h3>Crack Test Details</h3>

        <p>
            <strong>Mode:</strong>
            <span id="mode"></span>
        </p>

        <p>
            <strong>Guesses Tried:</strong>
            <span id="guesses"></span>
        </p>
    </div>

    <div class="comparison-box">
        <h3>Final Comparison</h3>
        <p id="comparison"></p>
    </div>
</div>

<script src="dictionary.js"></script>
<script src="script.js"></script>
</body>

<div class="special-star" style="top:10%; left:15%;"></div>
<div class="special-star" style="top:22%; left:75%;"></div>
<div class="special-star" style="top:65%; left:30%;"></div>
<div class="special-star" style="top:80%; left:85%;"></div>
<div class="special-star" style="top:45%; left:55%;"></div>

<div class="special-star" style="top:5%; left:50%;"></div>
<div class="special-star" style="top:35%; left:5%;"></div>
<div class="special-star" style="top:75%; left:60%;"></div>
<div class="special-star" style="top:55%; left:90%;"></div>
<div class="special-star" style="top:15%; left:92%;"></div>

</html>
